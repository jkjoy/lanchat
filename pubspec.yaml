name: lanchat
description: "LanChat: 局域网内无需服务器、跨 Windows/Android/macOS 的即时通讯应用"
publish_to: 'none'

version: 1.2.1+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  multicast_dns: ^0.3.2
  web_socket_channel: ^3.0.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  crypto: ^3.0.6
  shared_preferences: ^2.3.4
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.6.0+eol
  file_picker: ^13.1.0
  cryptography: ^2.9.0
  desktop_drop: ^0.8.4
  pasteboard: ^0.5.0
  record: ^6.2.1
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
