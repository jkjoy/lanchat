name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3

      - name: Enable Linux desktop (for headless test deps)
        run: flutter config --enable-linux-desktop

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanchat-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3

      - name: Pub get
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanchat-windows
          path: build/windows/x64/runner/Release/**/*.exe
          if-no-files-found: error

  build_macos:
    name: Build macOS
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3

      - name: Pub get
        run: flutter pub get

      - name: Build macOS (release)
        run: flutter build macos --release

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r lanchat-macos.zip lanchat.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanchat-macos
          path: build/macos/Build/Products/Release/lanchat-macos.zip
          if-no-files-found: error

  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze_test, build_android, build_windows, build_macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "## LanChat \$TAG" > notes.md
          echo "" >> notes.md
          cat CHANGELOG.md 2>/dev/null >> notes.md || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lanchat-android/**/*.apk
            artifacts/lanchat-windows/**/*.exe
            artifacts/lanchat-macos/**/*.zip
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false